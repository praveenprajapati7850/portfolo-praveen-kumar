<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Playfair+Display:ital,wght@1,600;1,700&amp;display=swap');
      .sans { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .playfair { font-family: 'Playfair Display', Georgia, serif; }
    </style>
    <pattern id="topoPattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 0 30 Q 30 10 60 30 T 120 30 M 0 60 Q 30 40 60 60 T 120 60 M 0 90 Q 30 70 60 90 T 120 90" fill="none" stroke="#1e1b4b" stroke-width="1.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- Ornate Left and Right Topographic Navy Sidebars -->
  <rect x="0" y="0" width="120" height="900" fill="#0c1033"/>
  <rect x="0" y="0" width="120" height="900" fill="url(#topoPattern)"/>
  
  <rect x="1080" y="0" width="120" height="900" fill="#0c1033"/>
  <rect x="1080" y="0" width="120" height="900" fill="url(#topoPattern)"/>

  <!-- Inner framing -->
  <rect x="135" y="15" width="930" height="870" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Aspire Logo -->
  <g transform="translate(600, 110)">
    <text x="0" y="0" text-anchor="middle" fill="#e11d48" font-family="'Plus Jakarta Sans', sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Aspire</text>
    <text x="0" y="22" text-anchor="middle" fill="#1e293b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="5">I N S T I T U T E</text>
  </g>

  <!-- Award Text -->
  <text x="600" y="210" text-anchor="middle" fill="#1e293b" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600">Aspire Institute Awards this Certificate to</text>

  <!-- Praveen Kumar Name in Red Italic Script -->
  <text x="600" y="300" text-anchor="middle" fill="#dc2626" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="48" font-weight="700">Praveen kumar</text>

  <!-- Completion Statement -->
  <text x="600" y="385" text-anchor="middle" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500">who has successfully completed all modules of the</text>

  <!-- Program Name in Bold Crimson Red -->
  <text x="600" y="455" text-anchor="middle" fill="#dc2626" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800">2026 Aspire Leaders Program</text>

  <!-- Date -->
  <text x="600" y="515" text-anchor="middle" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="600">April 2026</text>

  <!-- Paragraph Description -->
  <g font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" fill="#334155" font-weight="400" text-anchor="middle">
    <text x="600" y="600">Through their dedicated participation, <tspan font-weight="700" fill="#0f172a">Praveen</tspan> has demonstrated increased self-confidence, enhanced critical thinking skills,</text>
    <text x="600" y="628">strengthened communication skills, and a deepened commitment to making a positive social impact among a global community.</text>
    <text x="600" y="656">This certificate affirms the completion of 40 hours of coursework through the Aspire Leaders Program.</text>
    <text x="600" y="684">May it serve as a testament to their dedication, hard work, and continued pursuit of excellence.</text>
  </g>
</svg>